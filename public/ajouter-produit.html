<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un Produit - AgriConnect</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .form-container { background: white; padding: 30px; border-radius: 12px; max-width: 500px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 15px; cursor: pointer; font-size: 17px; border-radius: 6px; font-weight: bold; }
        .preview-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin: 10px 0; border: 1px solid #eee; display: block; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>🍎 Mettre un produit en vente</h2>
    <form id="productForm">
        <label>Nom du produit</label>
        <input type="text" id="nom" placeholder="Ex: Banane Plantain" required>

        <label>Catégorie</label>
        <select id="categorie" required>
            <option value="Légumes">Légumes</option>
            <option value="Fruits">Fruits</option>
            <option value="Tubercules">Tubercules</option>
            <option value="Céréales">Céréales</option>
        </select>

        <div style="display:flex; gap:10px;">
            <div style="flex:2"><label>Prix (FCFA)</label><input type="number" id="prix" required></div>
            <div style="flex:1"><label>Unité</label><input type="text" id="unite" placeholder="kg" required></div>
        </div>

        <label>Stock disponible</label>
        <input type="number" id="quantite" required>

        <label>URL de l'image</label>
        <input type="text" id="image" oninput="document.getElementById('p-preview').src = this.value" placeholder="Lien de la photo">
        <img id="p-preview" class="preview-img" src="https://via.placeholder.com/400x150?text=Aperçu+Photo">

        <button type="submit" id="submitBtn">🚀 Publier sur le marché</button>
    </form>
    <p style="text-align:center;"><a href="dashboard.html" style="color:#666; text-decoration:none;">⇠ Retour au dashboard</a></p>
</div>

<script>
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "⏳ Publication...";

        const data = {
            nom: document.getElementById('nom').value,
            categorie: document.getElementById('categorie').value,
            prix: document.getElementById('prix').value,
            unite: document.getElementById('unite').value,
            quantite: document.getElementById('quantite').value,
            image: document.getElementById('image').value,
            agriculteurId: localStorage.getItem('userId')
        };

        try {
            const response = await fetch('/api/products/add', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert("Produit ajouté !");
                window.location.href = "dashboard.html";
            }
        } catch (error) {
            alert("Erreur de connexion");
            btn.disabled = false;
            btn.innerText = "🚀 Publier sur le marché";
        }
    });
</script>
</body>
</html>
